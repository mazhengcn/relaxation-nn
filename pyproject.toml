[project]
name = "relaxnn"
version = "0.1.0"
description = "Experiment environment for Relaxation Neural Networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.4.0",
    "matplotlib>=3.10.8",
    "ml-collections>=1.1.0",
    "numpy>=2.4.4",
    "smt>=2.13.0",
    "torch>=2.11.0",
]

[project.optional-dependencies]
jax = [
    "clu>=0.0.12",
    "etils[epath]>=1.14.0",
    "flax>=0.12.6",
    "grain>=0.2.16",
    "jax[cuda13]>=0.9.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.36",
    "tensorboard>=2.20.0",
    "tensorflow-cpu>=2.21.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ipython>=9.12.0", "pytest>=9.0.3"]

[tool.pytest.ini_options]
addopts = "--ignore=pinns_jax"
