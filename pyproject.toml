[project]
name = "relaxnn"
version = "0.1.0"
description = "Experiment environment for Relaxation Neural Networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.4.0",
    "clu>=0.0.12",
    "flax>=0.12.6",
    "grain>=0.2.16",
    "jax[cuda13]>=0.9.2",
    "orbax-checkpoint>=0.11.33",
    "smt>=2.13.0",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ipython>=9.12.0", "pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["pinns_jax"]
