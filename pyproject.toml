[project]
name = "relaxnn"
version = "0.1.0"
description = "Experiment environment for Relaxation Neural Networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.4.0",
    "matplotlib>=3.10.8",
    "ml-collections>=1.1.0",
    "numpy>=2.4.4",
    "smt>=2.13.0",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ipython>=9.12.0", "pytest>=9.0.3"]
