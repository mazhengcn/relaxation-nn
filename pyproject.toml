[project]
name = "relaxnn"
version = "0.1.0"
description = "Experiment environment for Relaxation Neural Networks"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "absl-py>=2.1,<3",
    "clawpack>=5.14.0",
    "matplotlib>=3.8,<4",
    "ml-collections>=0.1.1,<1",
    "numpy==1.24.4",
    "smt>=2.13.0",
]

[project.optional-dependencies]
train = [
    "torch==2.3.0",
]

[tool.uv]
package = false
